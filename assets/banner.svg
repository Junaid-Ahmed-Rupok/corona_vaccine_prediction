      <line x1="41" y1="41" x2="59" y2="59"/><line x1="-41" y1="-41" x2="-59" y2="-59"/>
      <line x1="41" y1="-41" x2="59" y2="-59"/><line x1="-41" y1="41" x2="-59" y2="59"/>
    </g>
    <g fill="#5fd3c4">
